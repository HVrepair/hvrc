<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>HVRC業務</title>
<!-- iPhoneのホーム画面に追加したときの名前・アイコン・全画面表示 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HVRC業務">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B2A3A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<!-- 裏で動く Apps Script のURL（GitHub に置くとき。config.js に書く） -->
<script src="config.js"></script>
<style>
  :root {
    --navy: #1B2A3A; --blue: #2563A8; --blue-l: #DCE8F5; --orange: #A9520A; --orange-l: #FBEBDD;
    --green: #1B6E2E; --green-l: #E2F0D9; --bg: #F3F4F1; --card: #FFFFFF; --line: #D9DEE3; --sub: #5A6775; --text: #1F2933;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 16px; line-height: 1.5; }
  button { font: inherit; }
  .hidden { display: none !important; }
  header.bar { position: sticky; top: 0; z-index: 10; background: var(--navy); color: #fff; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right));
    display: flex; align-items: center; gap: 12px; min-height: 56px; }
  header.bar .title { font-weight: 700; font-size: 17px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header.bar button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
  main { padding: 12px 16px 80px; max-width: 720px; margin: 0 auto; }

  /* ログイン */
  #login { max-width: 400px; margin: 0 auto; padding: 48px 20px; padding-top: calc(48px + env(safe-area-inset-top)); }
  #login .logo { width: 72px; height: 72px; border-radius: 16px; display: block; margin-bottom: 16px; }
  #login h1 { font-size: 22px; color: var(--navy); margin: 0 0 4px; }
  #login p.sub { color: var(--sub); margin: 0 0 24px; font-size: 14px; }
  label.f { display: block; font-size: 14px; color: var(--sub); margin: 14px 0 6px; }
  input.f { width: 100%; font-size: 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  select.f { width: 100%; font-size: 17px; padding: 12px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); }
  .btn { display: block; width: 100%; padding: 14px; font-size: 17px; font-weight: 700; border-radius: 10px; border: none; background: var(--blue); color: #fff; margin-top: 22px; }
  .btn:disabled { opacity: .5; }
  .err { color: #B42318; font-size: 14px; margin-top: 12px; white-space: pre-wrap; }

  /* 一覧 */
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; }
  .tab { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 15px; color: var(--sub); }
  .tab.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .tab .n { font-weight: 700; margin-left: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .card.tap:active { background: #F7F9FB; }
  .row1 { display: flex; align-items: baseline; gap: 8px; }
  .no { font-weight: 700; font-size: 18px; color: var(--navy); }
  .date { color: var(--sub); font-size: 14px; }
  .name { font-size: 16px; margin-top: 2px; }
  .meta { color: var(--sub); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #EEF1F4; color: var(--sub); }
  .chip.kind { background: var(--blue-l); color: #1B4F8A; }
  .chip.state { background: var(--navy); color: #fff; }
  .chip.done { background: var(--green-l); color: var(--green); }
  .pbar { height: 8px; background: #E6E9EC; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .pbar > div { height: 100%; background: var(--blue); }
  .pbar.full > div { background: var(--green); }
  .pct { font-size: 13px; color: var(--sub); margin-top: 2px; text-align: right; }
  .empty { color: var(--sub); text-align: center; padding: 32px 0; }
  .updated { color: var(--sub); font-size: 12px; text-align: right; margin: 4px 0 8px; }

  /* 修理1件 */
  .head { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .head .big { font-size: 20px; font-weight: 700; color: var(--navy); }
  .flag { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 15px; }
  .switch { width: 52px; height: 30px; border-radius: 15px; background: #CBD2D9; position: relative; border: none; flex: 0 0 auto; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--blue); }
  .switch.on::after { left: 25px; }
  .stage { margin: 18px 0 6px; font-weight: 700; font-size: 17px; color: var(--navy); display: flex; justify-content: space-between; align-items: center; }
  .stage .cnt { font-size: 13px; color: var(--sub); font-weight: 400; }
  .section { font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; display: flex; align-items: stretch; overflow: hidden; }
  .item .main { flex: 1; display: flex; gap: 12px; padding: 12px; align-items: flex-start; background: transparent; border: none; text-align: left; color: inherit; min-height: 56px; }
  .item .main:active { background: #F7F9FB; }
  .box { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; border: 2px solid #9AA5B1; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 16px; }
  .item.done .box { background: var(--green); border-color: var(--green); }
  .item.na .box { background: #9AA5B1; border-color: #9AA5B1; font-size: 12px; }
  .item.done .lbl, .item.na .lbl { color: var(--sub); }
  .item .lbl { font-size: 16px; }
  .item .by { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
  .badge.auto { background: var(--orange-l); color: var(--orange); }
  .badge.scan { background: var(--blue-l); color: #1B4F8A; }
  .na-btn { flex: 0 0 auto; border: none; border-left: 1px solid var(--line); background: #FAFAF8; color: var(--sub); font-size: 12px; padding: 0 10px; width: 64px; }
  .item.busy { opacity: .5; pointer-events: none; }
  .item.pending .by { color: var(--blue); }
  .item .box { touch-action: none; }
  .item.swipe { border-color: var(--green); box-shadow: 0 0 0 2px rgba(46,125,79,.25) inset; }
  .item.swipe .box { background: #DDF0E3; border-color: var(--green); }
  .sheet input.f { margin: 8px 0; }

  /* マイページ */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .v { font-size: 26px; font-weight: 700; color: var(--navy); line-height: 1.2; }
  .tile .v small { font-size: 14px; font-weight: 400; color: var(--sub); margin-left: 2px; }
  .tile .k { font-size: 13px; color: var(--sub); }
  .h2 { font-weight: 700; font-size: 17px; color: var(--navy); margin: 22px 0 8px; }
  .note { font-size: 12px; color: var(--sub); margin-top: 6px; }
  .tbar { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 14px; }
  .tbar .nm { width: 116px; flex: 0 0 auto; color: var(--text); }
  .tbar .bar { flex: 1; height: 10px; background: #E6E9EC; border-radius: 5px; overflow: hidden; }
  .tbar .bar > div { height: 100%; background: var(--blue); }
  .tbar .t { width: 72px; flex: 0 0 auto; text-align: right; color: var(--sub); }
  .recent a { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; }
  .pw input { margin-bottom: 8px; }
  .btn.sub { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 400; }
  .okmsg { color: var(--green); font-size: 14px; margin-top: 10px; }

  /* 下のタブ */
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabbar button { flex: 1; border: none; background: transparent; padding: 10px 0 12px; font-size: 14px; color: var(--sub); }
  nav.tabbar button.on { color: var(--navy); font-weight: 700; box-shadow: inset 0 3px 0 var(--blue); }
  main { padding-bottom: 96px; }
  #toast.ok { background: var(--green); }

  /* 読み取り */
  .scan { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .scan .scanin { flex: 1; min-width: 0; font-size: 17px; padding: 10px 12px; }
  .scan .cam { flex: 0 0 auto; padding: 10px 10px; border: 1px solid var(--blue); border-radius: 10px; color: var(--blue); font-size: 13px; font-weight: 700; background: #fff; }
  .scan .ok { margin-left: 0; flex: 0 0 auto; padding: 10px 14px; border-radius: 10px; border: none; background: var(--blue); color: #fff; font-weight: 700; font-size: 15px; }
  .panel { background: #F7F9FB; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: -2px 0 10px; }
  .panel .cnt { font-size: 22px; font-weight: 700; color: var(--navy); }
  .lanes { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 8px 0; }
  .crow { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 6px; }
  .rbar { padding: 6px 4px; border-radius: 8px; }
  .rbar.tap { cursor: pointer; }
  .rbar.on { background: #EEF4FF; }
  .rbar .rl { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .rbar .rn { color: var(--sub); white-space: nowrap; }
  .rbar .rb { height: 8px; background: #EEF0F3; border-radius: 4px; margin-top: 3px; overflow: hidden; }
  .rbar .rb div { height: 100%; background: var(--navy); border-radius: 4px; }
  .igrid { width: 100%; border-collapse: collapse; margin: 6px 0; }
  .igrid th { font-size: 13px; color: var(--sub); font-weight: 400; padding: 4px 2px; }
  .igrid td { padding: 3px 2px; }
  .igrid input { width: 100%; font-size: 17px; padding: 9px 4px; border: 1px solid var(--line); border-radius: 8px; text-align: center; background: #fff; }
  .igrid td.rk { font-weight: 700; font-size: 14px; white-space: nowrap; padding-right: 6px; }
  .btns.two a { flex: 1 1 45%; }
  .lanes button { padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 700; color: var(--navy); }
  .lanes button small { display: block; font-size: 10px; color: #F28C28; line-height: 1; }
  .lanes button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .mlist { margin-top: 8px; }
  .mlist .m { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mlist .m button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--sub); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .btns a, .btns button { display: block; text-align: center; padding: 16px 8px; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; border: none; font-size: 16px; }
  .btns .alt { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  table.t { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; }
  table.t th, table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  table.t th { background: #EEF1F4; color: var(--sub); font-weight: 400; font-size: 13px; }
  table.t td.n { text-align: right; font-weight: 700; }
  .seg { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .seg button { flex: 1 1 auto; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 15px; color: var(--text); min-width: 56px; }
  .seg button.on { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 700; }
  .seg button.junk.on { background: #B42318; border-color: #B42318; }
  .lbl2 { font-size: 13px; color: var(--sub); margin-top: 10px; }
  .big-ok { background: var(--green-l); color: var(--green); border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: 16px; }
  .big-ok b { font-size: 20px; }
  .sel { border: 2px solid var(--blue) !important; }
  .sheet textarea { width: 100%; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; min-height: 64px; }
  .sheet ul { margin: 0 0 12px; padding-left: 20px; color: #B42318; }
  .inline { padding: 0 12px 12px 52px; }
  .inline .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .inline .opt { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--blue); background: #fff; color: var(--blue); font-size: 15px; font-weight: 700; }
  .inline input { width: 90px; font-size: 18px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .inline .ok { padding: 9px 16px; border-radius: 8px; border: none; background: var(--blue); color: #fff; font-weight: 700; margin-left: 8px; }

  /* 確認・お知らせ */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 20px 16px 28px; }
  .sheet p { margin: 0 0 16px; font-size: 16px; }
  .sheet .two { display: flex; gap: 10px; }
  .sheet .two button { flex: 1; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; border: 1px solid var(--line); background: #fff; }
  .sheet .two .danger { background: #B42318; color: #fff; border-color: #B42318; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #B42318; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: 90%; }
  /* 新しい受注 */
  .newbtn { margin: 0 0 12px; text-align: center; text-decoration: none; }
  .req { font-size: 11px; color: #B42318; margin-left: 4px; }
  .nrow { display: flex; gap: 10px; align-items: center; }
  .nrow input.f { flex: 1; min-width: 0; }
  .nrow .chk { flex: 0 0 auto; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .nrow .chk input { width: 22px; height: 22px; }
  input.f:disabled { background: #EEF1F4; color: #9AA5B1; }
  textarea.f { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-family: inherit; }
  details.more { margin-top: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 14px; }
  details.more summary { font-size: 14px; color: var(--blue); font-weight: 700; }
  .mini { border: 1px solid var(--blue); background: #fff; color: var(--blue); border-radius: 8px; padding: 2px 10px; font-size: 13px; font-weight: 700; margin-left: 4px; }
  .warnbox { background: #FDECEA; color: #B42318; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .lk { font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .lk:last-of-type { border-bottom: none; }
  .lk.dup b { color: #B42318; }
  .pcand { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 6px 0; font-size: 14px; color: var(--text); }
  .pcand.on { border: 2px solid var(--navy); background: #EEF3F8; }
  .pcand .exp { color: #B42318; font-size: 13px; }
  .pcand.expd { background: #F4F4F2; color: #8A8F96; }
  .chip.exp { background: #FDECEA; color: #B42318; margin-left: 6px; }
  .linkbtn { border: none; background: transparent; color: var(--blue); font-weight: 700; font-size: 14px; padding: 8px 0; }
  /* カレンダー */
  .calhead { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
  .calhead b { font-size: 19px; }
  .calhead button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; font-size: 16px; color: var(--navy); }
  .calhead .thism { font-size: 13px; padding: 8px 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal .wd { text-align: center; font-size: 12px; color: var(--sub); padding: 2px 0; }
  .cal .wd.sun, .cal .dc.sun .dn { color: #B42318; } .cal .wd.sat, .cal .dc.sat .dn { color: #2563A8; }
  .cal .dc { background: #fff; border: 1px solid var(--line); border-radius: 8px; min-height: 58px; padding: 3px 3px 4px; text-align: left; font: inherit; color: var(--text); display: flex; flex-direction: column; gap: 2px; }
  .cal .dc.empty { background: transparent; border: none; }
  .cal .dc.today { border: 2px solid #F28C28; }
  .cal .dc.sel { background: #EEF3F8; border-color: var(--navy); }
  .cal .dn { font-size: 13px; font-weight: 700; }
  .cal .bars { display: flex; flex-direction: column; gap: 2px; }
  .cal .bar { height: 5px; border-radius: 3px; }
  .cal .more { font-size: 10px; color: var(--sub); }
  .cal .cnt { margin-left: auto; font-size: 11px; color: var(--sub); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--sub); margin: 8px 0 4px; }
  .legend i { display: inline-block; width: 12px; height: 6px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  .card .sbar { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  /* 在庫表 */
  .ztwrap { overflow-x: auto; }
  .zt { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 15px; margin-bottom: 12px; }
  .zt th { background: var(--navy); color: #fff; font-size: 13px; padding: 7px 4px; text-align: center; font-weight: 700; }
  .zt td { padding: 7px 4px; text-align: center; border-top: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; }
  .zt td.rk { text-align: left; padding-left: 10px; font-weight: 700; color: var(--navy); white-space: nowrap; }
  .zt td.sum { background: #FFF4E8; color: #C2410C; }
  .zt td.z { color: #C5CAD1; font-weight: 400; }
  .zt tr.grp td { background: #EEF1F4; color: var(--navy); text-align: left; padding-left: 10px; font-size: 13px; font-weight: 800; }
  .zt tr.sub td { background: #F7F8F9; }
  .zt tr.tot td { background: #FDE9D4; border-top: 2px solid #F28C28; }
  .zt tr.one td.memo { font-size: 12px; font-weight: 400; color: var(--sub); text-align: left; }
  .zt tr.new td.rk { color: #C2410C; }
  .zt.mon td.up { color: var(--green); } .zt.mon td.down { color: #B42318; }
  /* 在庫の一目表 */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .bcell { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .bcell .g { font-size: 15px; font-weight: 800; color: var(--navy); }
  .bcell .v { font-size: 30px; font-weight: 800; color: var(--navy); line-height: 1.1; }
  .bcell .v small { font-size: 14px; font-weight: 700; margin-left: 2px; }
  .bcell .v.low { color: #B42318; }
  .bcell .w { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .bcell .u { font-size: 12px; color: var(--text); margin-top: 4px; font-weight: 700; }
  .bcell.new { border-color: #F28C28; }
  .bcell.new .g, .bcell.new .v { color: #C2410C; }
  .sheet p { white-space: pre-wrap; }
  .verwarn { background: #FDECEA; color: #B42318; font-size: 13px; font-weight: 700; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top)); }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(243,244,241,.7); z-index: 40; font-size: 15px; color: var(--sub); }
</style>
</head>
<body>

<div id="login" class="hidden">
  <img class="logo" src="icon-180.png" alt="" onerror="this.style.display='none'">
  <h1>HVRC 業務</h1>
  <p class="sub">ハイブリッドバッテリーリペアセンター</p>
  <label class="f" for="lid">ログインID</label>
  <input class="f" id="lid" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label class="f" for="lpw">パスワード</label>
  <input class="f" id="lpw" type="password" autocomplete="current-password">
  <button class="btn" id="lbtn">ログイン</button>
  <div class="err" id="lerr"></div>
</div>

<div id="app" class="hidden">
  <header class="bar">
    <button id="back" class="hidden">← 戻る</button>
    <div class="title" id="title">修理の一覧</div>
    <button id="reload">更新</button>
  </header>
  <main id="main"></main>
  <nav class="tabbar"><button data-nav="#/list">修理</button><button data-nav="#/cal">予定</button><button data-nav="#/inv">在庫</button><button data-nav="#/me">マイページ</button></nav>
</div>

<div id="loading" class="hidden">読み込み中…</div>
<div id="toast" class="hidden"></div>

<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'hvrc_token';
  var APP_VERSION = '';
  // この画面（index.html）の版。Code.gs の HV_VERSION と同じにして配る。サーバーのほうが新しければ注意を出す
  var SCREEN_VERSION = '2026-11-09p';
  var NEED_SCREEN = ''; // サーバーが求める画面の版（古いサーバーは送ってこないので、そのときはサーバーの版と比べる）
  var API_URL = String(window.HV_API_URL || '').trim();
  var IN_GAS = !!(window.google && google.script && google.script.run);
  var token = '';
  var me = null;
  var listCache = null;
  var listTab = 'today';
  var current = null;   // 開いている修理
  var openInline = '';  // 入力・選択を開いている項目ID

  // ---- 保存（使えない端末でも動くように） ----
  function loadToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return token; } }
  function saveToken(t) { token = t; try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { /* 保存できない端末 */ } }

  // ---- 共通 ----
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add('hidden'); }, 4000); }
  function loading(on) { $('loading').classList.toggle('hidden', !on); }

  // サーバーを呼ぶ：Googleの画面の中なら google.script.run、GitHub に置いた画面なら config.js のURLへ送る
  function call(action, payload) {
    var done = function (res, resolve, reject) {
      if (res && res.ok) return resolve(res.data);
      if (res && res.relogin) { saveToken(''); showLogin(res.error); }
      reject(new Error(res ? res.error : '通信に失敗しました'));
    };
    var fail = function (err) { return new Error('通信に失敗しました。電波の良い場所でもう一度お試しください（' + (err && err.message || err) + '）'); };
    return new Promise(function (resolve, reject) {
      if (IN_GAS) {
        google.script.run
          .withSuccessHandler(function (res) { done(res, resolve, reject); })
          .withFailureHandler(function (err) { reject(fail(err)); })
          .api(action, token, payload || {});
        return;
      }
      if (!API_URL) { reject(new Error('config.js に裏で動くURL（…/exec）が書かれていません。管理者に連絡してください')); return; }
      // text/plain で送る（Apps Script はこの形なら別のサイトからでも受け取れる）
      fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, token: token, payload: payload || {} }) })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (res) { done(res, resolve, reject); })
        .catch(function (err) { reject(fail(err)); });
    });
  }

  function confirmSheet(msg, okLabel) {
    return new Promise(function (resolve) {
      var bg = document.createElement('div');
      bg.className = 'sheet-bg';
      bg.innerHTML = '<div class="sheet"><p>' + esc(msg) + '</p><div class="two"><button data-a="0">やめる</button><button class="danger" data-a="1">' + esc(okLabel || 'OK') + '</button></div></div>';
      bg.addEventListener('click', function (e) {
        var a = e.target.getAttribute('data-a');
        if (a === null && e.target !== bg) return;
        document.body.removeChild(bg);
        resolve(a === '1');
      });
      document.body.appendChild(bg);
    });
  }

  // ---- ログイン ----
  function showLogin(msg) {
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('lerr').textContent = msg || '';
  }
  $('lbtn').addEventListener('click', doLogin);
  $('lpw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  function doLogin() {
    var id = $('lid').value.trim(), pw = $('lpw').value;
    if (!id || !pw) { $('lerr').textContent = 'IDとパスワードを入力してください'; return; }
    $('lbtn').disabled = true; $('lerr').textContent = '';
    call('login', { loginId: id, password: pw, device: navigator.userAgent.indexOf('iPhone') >= 0 ? 'iPhone' : (navigator.userAgent.indexOf('iPad') >= 0 ? 'iPad' : (navigator.userAgent.indexOf('Android') >= 0 ? 'Android' : 'PC')) })
      .then(function (d) {
        saveToken(d.token); me = d.me; APP_VERSION = d.version || APP_VERSION; NEED_SCREEN = d.screen || d.version || NEED_SCREEN; versionCheck(); $('lpw').value = '';
        $('login').classList.add('hidden'); $('app').classList.remove('hidden');
        route();
      })
      .catch(function (e) { $('lerr').textContent = e.message; })
      .then(function () { $('lbtn').disabled = false; });
  }
  function doLogout() {
    confirmSheet('ログアウトしますか？', 'ログアウト').then(function (ok) {
      if (!ok) return;
      call('logout').catch(function () {}).then(function () { saveToken(''); me = null; showLogin(''); location.hash = '#/list'; });
    });
  }
  document.querySelector('nav.tabbar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-nav]');
    if (b) location.hash = b.getAttribute('data-nav');
  });
  var backTo = '#/list';
  function setNav(tab, back) {
    Array.prototype.forEach.call(document.querySelectorAll('nav.tabbar button'), function (b) { b.classList.toggle('on', b.getAttribute('data-nav') === tab); });
    backTo = back || '';
    $('back').classList.toggle('hidden', !back);
  }
  // 画面（GitHub の index.html）がサーバーより古いときは、上に注意を出す
  function versionCheck() {
    var old = document.getElementById('verWarn'); if (old) old.remove();
    if (!NEED_SCREEN || !SCREEN_VERSION || SCREEN_VERSION >= NEED_SCREEN) return;
    var d = document.createElement('div');
    d.id = 'verWarn';
    d.className = 'verwarn';
    d.innerHTML = '画面が古い版です（画面 ' + esc(SCREEN_VERSION) + '／サーバー ' + esc(APP_VERSION) + '）。アプリを閉じて開き直してください。直らなければ管理者へ（GitHub の index.html の更新）';
    var app = $('app'); if (app) app.insertBefore(d, app.firstChild);
  }
  function okToast(msg) { var t = $('toast'); toast(msg); t.classList.add('ok'); clearTimeout(okToast._t); okToast._t = setTimeout(function () { t.classList.remove('ok'); }, 4000); }

  // ---- 画面の切り替え（戻るボタンにも対応） ----
  window.addEventListener('hashchange', route);
  // 画面の中のリンク（#/…）は、Googleの枠の外に飛ばないよう、ここで画面を切り替える
  //   （<base target="_top"> のため、普通のリンクだと外側のページごと移動して真っ白になる）
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    var h = a.getAttribute('href');
    if (location.hash === h) route(); else location.hash = h;
  }, true);
  $('back').addEventListener('click', function () { location.hash = backTo || '#/list'; });
  $('reload').addEventListener('click', function () {
    if (location.hash === '#/new') return; // 入力中の内容を消さない
    if (current) openOrder(current.key, true); else if (location.hash === '#/me') openMe(); else if (location.hash.indexOf('#/inv') === 0 || location.hash.indexOf('#/cal') === 0 || location.hash === '#/hidden' || location.hash === '#/rere') { reData = null; route(); } else loadList(true);
  });
  function route() {
    var h = location.hash || '#/list';
    var m = /^#\/order\/(.+)$/.exec(h);
    scanHandlers = {};
    if (m) { openOrder(decodeURIComponent(m[1])); return; }
    current = null;
    if (h === '#/me') openMe();
    else if (h === '#/inv') openInv();
    else if (h === '#/inv/in') openInbound();
    else if (h === '#/inv/dis') openDisList();
    else if (h.indexOf('#/inv/dis/') === 0) openUnit(decodeURIComponent(h.slice(10)));
    else if (h === '#/inv/insp') openInspect(false);
    else if (h === '#/inv/stock') openInspect(true);
    else if (h === '#/inv/pre') openPre();
    else if (h === '#/inv/cinsp') openCntInspect();
    else if (h === '#/inv/cadj') openCntAdj();
    else if (h === '#/inv/clog') openCntLog();
    else if (h.indexOf('#/inv/lot/') === 0) openCntUnit(decodeURIComponent(h.slice(10)));
    else if (h === '#/new') openNew();
    else if (h === '#/hidden') openHidden();
    else if (h === '#/rere') openRe();
    else if (h === '#/cal' || h.indexOf('#/cal/') === 0) openCal(h.slice(6));
    else loadList(false);
  }

  // ---- 予定（カレンダー） ----
  var calData = null, calSel = 0;
  var STORE_COLOR = { '苅田': '#1B2A3A', '行橋': '#1B2A3A', 'インター': '#2563A8', '大橋': '#2563A8', '出張': '#F28C28', '営業': '#2E7D4F' };
  function calColor(o) { return o.kind === '再修理' ? '#B42318' : (STORE_COLOR[o.store] || '#8A8F96'); }
  function openCal(ym) {
    setNav('#/cal', '');
    $('title').textContent = '予定';
    if (!ym && calData) ym = calData.y + '-' + calData.m;
    loading(true);
    call('cal', { ym: ym || '' }).then(function (d) {
      if (!calData || calData.y !== d.y || calData.m !== d.m) calSel = d.today || 0;
      calData = d; renderCal();
    }).catch(function (e) { toast(e.message); }).then(function () { loading(false); });
  }
  function calShift(n) {
    var y = calData.y, m = calData.m + n;
    if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
    var ym = y + '-' + (m < 10 ? '0' : '') + m;
    if (n < 0 && ym < calData.min) { toast('これより前の月は見られません（今年度と前年度だけ）'); return; }
    location.hash = '#/cal/' + ym;
  }
  function renderCal() {
    var d = calData;
    var first = new Date(d.y, d.m - 1, 1).getDay(), last = new Date(d.y, d.m, 0).getDate();
    var html = '<div class="calhead"><button type="button" data-calm="-1">◀</button><b>' + d.y + '年' + d.m + '月</b>' +
      '<span><button type="button" class="thism" data-calm="0">今月</button> <button type="button" data-calm="1">▶</button></span></div>';
    html += '<div class="cal">' + ['日', '月', '火', '水', '木', '金', '土'].map(function (w, i) { return '<div class="wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>'; }).join('');
    for (var i = 0; i < first; i++) html += '<div class="dc empty"></div>';
    for (var day = 1; day <= last; day++) {
      var list = d.days[day] || [], wd = (first + day - 1) % 7;
      html += '<button type="button" class="dc' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + (day === d.today ? ' today' : '') + (day === calSel ? ' sel' : '') + '" data-cald="' + day + '">' +
        '<span style="display:flex"><span class="dn">' + day + '</span>' + (list.length ? '<span class="cnt">' + list.length + '</span>' : '') + '</span><span class="bars">' +
        list.slice(0, 4).map(function (o) { return '<span class="bar" style="background:' + calColor(o) + (o.pct >= 100 ? ';opacity:.35' : '') + '"></span>'; }).join('') +
        (list.length > 4 ? '<span class="more">＋' + (list.length - 4) + '</span>' : '') + '</span></button>';
    }
    html += '</div>';
    html += '<div class="legend"><span><i style="background:#1B2A3A"></i>苅田</span><span><i style="background:#2563A8"></i>インター</span><span><i style="background:#F28C28"></i>出張</span><span><i style="background:#2E7D4F"></i>営業</span><span><i style="background:#B42318"></i>再修理</span><span>薄い色＝完了</span></div>';
    html += '<div class="note">この月 ' + d.count + ' 件</div>';
    if (calSel) {
      var sel = d.days[calSel] || [];
      var dt = new Date(d.y, d.m - 1, calSel);
      html += '<div class="h2">' + d.m + '/' + calSel + '(' + '日月火水木金土'.charAt(dt.getDay()) + ')　' + sel.length + '件</div>';
      html += sel.length ? sel.map(function (o) {
        var full = o.pct >= 100;
        return '<div class="card tap" data-key="' + esc(o.key) + '">' +
          '<div class="row1"><span class="no"><span class="sbar" style="background:' + calColor(o) + '"></span>' + esc(o.no) + '</span><span class="date">' + esc(o.time) + '</span></div>' +
          '<div class="name">' + esc(o.name) + '</div>' +
          '<div class="meta">' + esc([o.model, o.grade, o.store, o.kubun].filter(Boolean).join('・')) + '</div>' +
          '<div class="chips"><span class="chip kind">' + esc(o.kind) + '</span>' + (o.state ? '<span class="chip ' + (full ? 'done' : 'state') + '">' + esc(o.state) + '</span>' : '') + '</div>' +
          '<div class="pbar' + (full ? ' full' : '') + '"><div style="width:' + Math.min(100, o.pct) + '%"></div></div><div class="pct">' + o.pct + '%</div></div>';
      }).join('') : '<div class="empty">この日の修理はありません</div>';
    }
    $('main').innerHTML = html;
  }
  document.addEventListener('click', function (e) {
    if (location.hash.indexOf('#/cal') !== 0 || !calData) return;
    var t;
    if ((t = e.target.closest('[data-calm]'))) {
      var n = Number(t.getAttribute('data-calm'));
      if (n === 0) { location.hash = '#/cal/' + new Date().getFullYear() + '-' + (new Date().getMonth() + 1); return; }
      calShift(n); return;
    }
    if ((t = e.target.closest('[data-cald]'))) { calSel = Number(t.getAttribute('data-cald')); renderCal(); return; }
  });

  // ---- 一覧 ----
  var TABS = [['today', '今日'], ['upcoming', 'これから'], ['open', '進行中'], ['hold', '日付未定'], ['recent', '最近の完了']];
  function loadList(force) {
    setNav('#/list', '');
    $('title').textContent = (me ? me.name + 'さん　' : '') + '修理の一覧';
    if (listCache && !force) renderList();
    if (!listCache || force) loading(true);
    call('list').then(function (d) { listCache = d; renderList(); }).catch(function (e) { toast(e.message); }).then(function () { loading(false); });
  }
  function renderList() {
    var d = listCache;
    if (!d) return;
    var html = '<a class="btn newbtn" href="#/new">＋ 新しい受注を登録</a>';
    html += '<div class="tabs">' + TABS.map(function (t) {
      return '<button class="tab' + (listTab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '<span class="n">' + (d[t[0]] || []).length + '</span></button>';
    }).join('') + '</div>';
    html += '<div class="updated">' + esc(d.now) + ' 時点</div>';
    var list = d[listTab] || [];
    if (!list.length) html += '<div class="empty">' + ({ today: '今日の修理はありません', upcoming: 'これからの修理はありません', open: '進行中の修理はありません', recent: '最近の完了はありません', hold: '日付が未定の修理はありません' })[listTab] + '</div>';
    html += list.map(function (o) {
      var full = o.pct >= 100;
      return '<div class="card tap" data-key="' + esc(o.key) + '">' +
        '<div class="row1"><span class="no">' + esc(o.no) + '</span><span class="date">' + esc(o.date) + '</span></div>' +
        '<div class="name">' + esc(o.name) + '</div>' +
        '<div class="meta">' + esc([o.model, o.grade, o.store].filter(Boolean).join('・')) + '</div>' +
        '<div class="chips"><span class="chip kind">' + esc(o.kind) + '</span>' +
          (o.state ? '<span class="chip ' + (full ? 'done' : 'state') + '">' + esc(o.state) + '</span>' : '') + '</div>' +
        '<div class="pbar' + (full ? ' full' : '') + '"><div style="width:' + Math.min(100, o.pct) + '%"></div></div>' +
        '<div class="pct">' + o.pct + '%</div></div>';
    }).join('');
    html += '<div class="btns two" style="margin-top:18px"><a href="#/rere" class="alt">再修理の理由の集計</a><a href="#/hidden" class="alt">アプリに出していない受注</a></div>';
    $('main').innerHTML = html;
  }

  // ---- アプリに出していない受注（バッテリー交換以外など） ----
  function openHidden() {
    setNav('#/list', '#/list');
    $('title').textContent = 'アプリに出していない受注';
    loading(true);
    call('jobHidden').then(function (d) {
      var html = '<div class="note">修理内容に「' + d.words.map(esc).join('」「') + '」が入っていない受注は、一覧・カレンダー・棚卸表の自動記入に出しません（修理内容が空欄なら出します）。受注シートの行はそのままです。言葉は「設定」シートの「アプリに出す修理内容の言葉」で変えられます</div>';
      html += d.list.length ? d.list.map(function (o) {
        return '<div class="card"><div class="row1"><a class="no" href="#/order/' + encodeURIComponent(o.key) + '">' + esc(o.no) + '</a><span class="date">' + esc(o.date) + '</span></div>' +
          '<div class="name">' + esc(o.name) + '</div><div class="meta">' + esc([o.model, o.content].filter(Boolean).join('・')) + '</div>' +
          '<div class="meta">出していない理由：' + esc(o.why) + '</div><button class="btn sub" data-hshow="' + esc(o.key) + '">アプリに出す</button></div>';
      }).join('') : '<div class="empty">ありません</div>';
      $('main').innerHTML = html;
    }).catch(function (e) { toast(e.message); }).then(function () { loading(false); });
  }
  document.addEventListener('click', function (e) {
    if (location.hash !== '#/hidden') return;
    var t = e.target.closest('[data-hshow]'); if (!t) return;
    loading(true);
    call('jobHide', { key: t.getAttribute('data-hshow'), hide: false }).then(function () { listCache = null; okToast('アプリに出すようにしました'); openHidden(); })
      .catch(function (er) { toast(er.message); loading(false); });
  });

  // ---- 再修理の理由の集計 ----
  var reData = null, rePeriod = 'fy', reFilter = '';
  function openRe() {
    setNav('#/list', '#/list');
    $('title').textContent = '再修理の理由';
    if (reData) { renderRe(); return; }
    loading(true);
    call('reReasons').then(function (d) { reData = d; renderRe(); }).catch(function (e) { toast(e.message); }).then(function () { loading(false); });
  }
  function reRows() {
    var d = reData, fy = d.fy, today = d.today;
    var ago = function (m) { var t = new Date(today); t.setMonth(t.getMonth() - m); return t.toISOString().slice(0, 10); };
    var rng = { fy: [fy + '-04-01', (fy + 1) + '-03-31'], prev: [(fy - 1) + '-04-01', fy + '-03-31'], m3: [ago(3), '9999'], all: ['', '9999'] }[rePeriod];
    return d.rows.filter(function (r) { return !r.date || (r.date >= rng[0] && r.date <= rng[1]); }).filter(function (r) { return rePeriod === 'all' || r.date; });
  }
  function reBars(title, groups, total, key, order) {
    var keys = Object.keys(groups).sort(order || function (a, b) { return groups[b] - groups[a]; });
    if (!keys.length) return '';
    var max = groups[keys[0]] || 1;
    return '<div class="h2">' + title + '</div>' + keys.map(function (k) {
      var on = key && reFilter === key + '|' + k;
      return '<div class="rbar' + (key ? ' tap' : '') + (on ? ' on' : '') + '"' + (key ? ' data-refilter="' + esc(key + '|' + k) + '"' : '') + '><div class="rl"><span>' + esc(k) + '</span><span class="rn">' + groups[k] + '件　' + Math.round(groups[k] / total * 100) + '%</span></div>' +
        '<div class="rb"><div style="width:' + Math.max(3, groups[k] / max * 100) + '%"></div></div></div>';
    }).join('');
  }
  function renderRe() {
    var d = reData; if (!d) return;
    var rows = reRows(), total = rows.length;
    var html = '<div class="tabs">' + [['fy', '今年度'], ['prev', '前年度'], ['m3', '直近3か月'], ['all', '全部']].map(function (t) {
      return '<button class="tab' + (rePeriod === t[0] ? ' on' : '') + '" data-reper="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
    var none = rows.filter(function (r) { return !r.reason; });
    html += '<div class="tiles"><div class="tile"><div class="v">' + total + '<small>件</small></div><div class="k">再修理</div></div>' +
      '<div class="tile"><div class="v">' + (total - none.length) + '<small>件</small></div><div class="k">理由が入っている</div></div>' +
      '<div class="tile"><div class="v">' + none.length + '<small>件</small></div><div class="k">理由がまだ</div></div></div>';
    if (!total) { $('main').innerHTML = html + '<div class="empty">この期間の再修理はありません</div>'; return; }
    var g = function (f) { var o = {}; rows.forEach(function (r) { var k = f(r); if (k) o[k] = (o[k] || 0) + 1; }); return o; };

        });

      if ((t = e.target.closest('[data-castock]'))) {

  // ---- 入庫 ----

  // ---- 仕入れ（購入品が届いた：まとめて登録） ----
  function buyLive(e) {
    var t = e.target;
    if (!buy || !t || !t.id && !(t.getAttribute && t.getAttribute('data-bline'))) return;
    if (!/^(bPrice|bLooseQty|bNewUnits|bNewPer)$/.test(t.id) && !t.getAttribute('data-bline')) return;
    buyRead();
    var el = $('bSum'); if (el && invData) el.innerHTML = esc(buySumText(invData));
  }
  document.addEventListener('input', buyLive);
  document.addEventListener('change', buyLive);
  var buy = null, buyLast = null, buyCaseUnit = '', buyList = null;
  function buyReset() {
    var t = new Date();
    buy = { date: t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2),
      supplier: '', prefix: '', tax: '', loose: false, looseQty: '', lines: [{ model: '', count: 1 }], newUnits: 1, newPer: 28, price: '', note: '' };
  }
  function buySup(d) {
    var list = (d.buy && d.buy.suppliers) || [];
    for (var i = 0; i < list.length; i++) if (list[i].name === buy.supplier) return list[i];
    return null;
  }
  function buyNeed(d, model) {
    for (var i = 0; i < d.models.length; i++) if (d.models[i].model === model) return d.models[i].need || 0;
    return 0;
  }
  function buyTotals(d) {
    var sup = buySup(d);
    if (sup && sup.isNew) return { units: Number(buy.newUnits) || 0, qty: (Number(buy.newUnits) || 0) * (Number(buy.newPer) || 0) };
    if (buy.loose) return { units: 0, qty: Number(buy.looseQty) || 0 };
    var u = 0, q = 0;
    buy.lines.forEach(function (l) { var c = Number(l.count) || 0; if (l.model && c > 0) { u += c; q += c * buyNeed(d, l.model); } });
    return { units: u, qty: q };
  }
  function buyHtml(d) {
    if (!buy) buyReset();
    if (!d.buy) return '<div class="empty">サーバーが古い版です。管理者に「仕入れ」の貼り付けを確認してもらってください</div>';
    var sup = buySup(d), h = '';
    if (buyLast) {
      h += '<div class="big-ok">登録しました：<b>' + esc(buyLast.id) + '</b>　' + esc(buyLast.detail) + '（' + buyLast.qty + '本・税別 ' + Number(buyLast.ex).toLocaleString() + '円）' +
        (buyLast.label !== '-' ? '<br>ラベルに <b>' + esc(buyLast.label) + '</b> を書いてください' : '') + '</div>';
      if (buyLast.units && buyLast.units.length) {
        h += '<div class="lbl2">ケースのバーコード（あとでも可）：番号を選んで読む</div>' + buyLast.units.map(function (u) {
          return '<div class="card tap' + (buyCaseUnit === u.unitNo ? ' sel' : '') + '" data-buycase="' + esc(u.unitNo) + '"><div class="row1"><span class="no">' + esc(u.unitNo) + '</span><span class="date">' + esc(u.caseSerial ? 'ケース ' + u.caseSerial : '') + '</span></div><div class="meta">' + esc(u.model) + '</div></div>';
        }).join('');
        if (buyCaseUnit) h += scanBox('buycase', buyCaseUnit + ' のケースの製造番号');
      }
      h += '<button class="btn sub" data-buynew="1">続けて別の仕入れを登録する</button>';
    } else {
      h += '<div class="lbl2">届いた日</div><input class="f" type="date" id="bDate" value="' + esc(buy.date) + '">';
      h += '<div class="lbl2">購入先</div><div class="seg">' + d.buy.suppliers.map(function (s) {
        return '<button data-bsup="' + esc(s.name) + '"' + (buy.supplier === s.name ? ' class="on"' : '') + '>' + esc(s.name) + '</button>';
      }).join('') + '</div>';
      if (sup && sup.isNew) {
        h += '<div class="lbl2">新品ユニットの台数</div><input class="f" type="number" inputmode="numeric" id="bNewUnits" value="' + esc(buy.newUnits) + '">' +
          '<div class="lbl2">1台の本数</div><input class="f" type="number" inputmode="numeric" id="bNewPer" value="' + esc(buy.newPer) + '">';
      } else if (sup) {
        h += '<div class="seg"><button data-bloose="0"' + (!buy.loose ? ' class="on"' : '') + '>ユニット（番号を付ける）</button><button data-bloose="1"' + (buy.loose ? ' class="on"' : '') + '>バラのモジュール</button></div>';
        if (buy.loose) {
          h += '<div class="lbl2">本数</div><input class="f" type="number" inputmode="numeric" id="bLooseQty" value="' + esc(buy.looseQty) + '">' +
            '<div class="lbl2">未計測のどちらに入れるか</div><div class="seg">' + ['G2', 'G3'].map(function (x) { return '<button data-bcell="' + x + '"' + ((buy.cell || 'G2') === x ? ' class="on"' : '') + '>未計測 ' + x + '</button>'; }).join('') + '</div>';
        } else {
          h += '<div class="lbl2">車種と台数（まとめて買った分を全部）</div>' + buy.lines.map(function (l, i) {
            return '<div style="display:flex;gap:6px;align-items:center;margin:6px 0"><select class="f" data-bline="' + i + '" data-bk="model" style="flex:2"><option value="">車種を選ぶ</option>' +
              d.models.map(function (m) { return '<option' + (m.model === l.model ? ' selected' : '') + '>' + esc(m.model) + '</option>'; }).join('') + '</select>' +
              '<input class="f" type="number" inputmode="numeric" data-bline="' + i + '" data-bk="count" value="' + esc(l.count) + '" style="flex:1;min-width:0">' +
              '<span class="meta">台</span>' + (buy.lines.length > 1 ? '<button class="btn sub" data-bdel="' + i + '" style="width:auto;margin:0;padding:8px 10px">✕</button>' : '') + '</div>';
          }).join('') + '<button class="btn sub" data-badd="1">＋ 車種を足す</button>';
          var pre = buy.prefix || sup.prefix;
          h += '<div class="lbl2">未計測のどちらに入れるか</div><div class="seg">' + ['G2', 'G3'].map(function (x) { return '<button data-bcell="' + x + '"' + ((buy.cell || 'G2') === x ? ' class="on"' : '') + '>未計測 ' + x + '</button>'; }).join('') + '</div>';
          h += '<div class="lbl2">番号の頭</div><div class="seg">' + d.buy.prefixes.map(function (x) { return '<button data-bpre="' + x + '"' + (pre === x ? ' class="on"' : '') + '>' + x + '</button>'; }).join('') + '</div>';
        }
      }
      if (sup) {
        var tax = buy.tax || sup.tax;
        h += '<div class="lbl2">金額（全部で）</div><input class="f" type="number" inputmode="numeric" id="bPrice" value="' + esc(buy.price) + '" placeholder="無料なら 0">' +
          '<div class="seg"><button data-btax="税込"' + (tax === '税込' ? ' class="on"' : '') + '>税込</button><button data-btax="税別"' + (tax === '税別' ? ' class="on"' : '') + '>税別</button></div>' +
          '<div class="lbl2">メモ（出品者・取引No.など。なくても可）</div><input class="f" id="bNote" value="' + esc(buy.note) + '">';
        var t = buyTotals(d);
        h += '<div class="panel" id="bSum">' + esc(buySumText(d)) + '</div><button class="btn" data-bsave="1">登録する</button>';
      }
    }
    h += '<div class="lbl2" style="margin-top:22px">最近の仕入れ</div><div id="bList">' + buyListHtml() + '</div>';
    if (!buyList) buyLoadList();
    return h;
  }
  function buySumText(d) {
    var t = buyTotals(d), sup = buySup(d);
    var price = Number(buy.price) || 0, tax = buy.tax || (sup && sup.tax);
    return (t.units ? t.units + '台・' : '') + t.qty + '本' + (String(buy.price) !== '' ? '　税別 ' + Math.round(tax === '税込' ? price / 1.1 : price).toLocaleString() + '円' : '');
  }
  function buyListHtml() {
    if (!buyList) return '<div class="meta">読み込み中…</div>';
    if (!buyList.length) return '<div class="empty">まだありません</div>';
    return buyList.map(function (b) {
      return '<div class="card"><div class="row1"><span class="no">' + esc(b.label !== '-' ? b.label : b.id) + '</span><span class="date">' + esc(b.date) + '</span></div>' +
        '<div class="meta">' + esc(b.supplier + '　' + b.detail + '　' + b.qty + '本・税別 ' + Number(b.ex).toLocaleString() + '円　' + b.by) + (b.state !== '有効' ? '　<b>' + esc(b.state) + '</b>' : '') + '</div>' +
        (b.canCancel ? '<button class="btn sub" data-bcancel="' + esc(b.id) + '" style="margin-top:8px">まちがえたので取り消す</button>' : '') + '</div>';
    }).join('');
  }
  function buyLoadList() {
    call('invBuyList').then(function (r) { buyList = r.list; var el = $('bList'); if (el) el.innerHTML = buyListHtml(); }).catch(function () { buyList = []; });
  }
  function buyRead() {
    var g = function (id) { var el = $(id); return el ? el.value : null; };
    if (g('bDate') !== null) buy.date = g('bDate');
    if (g('bPrice') !== null) buy.price = g('bPrice');
    if (g('bNote') !== null) buy.note = g('bNote');
    if (g('bLooseQty') !== null) buy.looseQty = g('bLooseQty');
    if (g('bNewUnits') !== null) buy.newUnits = g('bNewUnits');
    if (g('bNewPer') !== null) buy.newPer = g('bNewPer');
    document.querySelectorAll('[data-bline]').forEach(function (el) { buy.lines[Number(el.getAttribute('data-bline'))][el.getAttribute('data-bk')] = el.value; });
  }
  function buySave() {
    buyRead();
    var d = invData, sup = buySup(d), t = buyTotals(d);
    if (!sup) { toast('購入先を選んでください'); return; }
    if (String(buy.price).trim() === '') { toast('金額を入れてください（無料なら 0）'); return; }
    if (!t.qty) { toast(sup.isNew ? '台数を入れてください' : buy.loose ? '本数を入れてください' : '車種と台数を入れてください'); return; }
    var p = { date: buy.date, supplier: sup.name, prefix: buy.prefix || sup.prefix || '', tax: buy.tax || sup.tax, price: buy.price, note: buy.note,
      loose: !!buy.loose, looseQty: buy.looseQty, lines: buy.lines, newUnits: buy.newUnits, newPer: buy.newPer, cell: buy.cell || 'G2' };
    confirmSheet(sup.name + '　' + buySumText(d) + '\nこの内容で登録しますか？', '登録する').then(function (ok) {
      if (!ok) return;

        buyLast = r; buyCaseUnit = ''; buyList = null; buyReset();

  function doInbound(serial) {

    else {

      inLast = r; inUnit = '';
      return invLoad(true).then(renderInbound);
    }).catch(function (e) { toast(e.message); });
  }

      return;
    }
    // お客様ごと（名前＋電話番号）にまとめて、新しい順に
    var groups = {}, order = [];
    hits.slice().sort(nByDate).forEach(function (o) {
      if (o.cancel && !o.name) return;
      var k = o.nn + '|' + o.tel;
      if (!groups[k]) { groups[k] = { last: o, n: 0 }; order.push(k); }
      groups[k].n++;
    });
    nCusList = order.slice(0, 20).map(function (k) { return groups[k]; });
    box.innerHTML = nCusList.length ? nCusList.map(function (g, i) {
      var o = g.last;
      return '<button type="button" class="pcand" data-ncus="' + i + '"><b>' + esc(o.name) + '</b>' + (o.store === '営業' ? '<span class="chip kind" style="margin-left:6px">業者</span>' : '') +
        '<br><span class="meta">' + esc([o.phone, o.address].filter(Boolean).join('　')) + '</span>' +
        '<br><span class="meta">前回 ' + esc([o.no, o.date, o.model, o.grade].filter(Boolean).join('　')) + (g.n > 1 ? '　ほか' + (g.n - 1) + '件' : '') + '</span></button>';
    }).join('') + (order.length > 20 ? '<div class="note">ほかに ' + (order.length - 20) + ' 件。もう少し詳しく入れてください</div>' : '')
      : '<div class="note">見つかりません（新しいお客様）</div>';
  }
  // 再修理の元の修理の候補：保証期限内を先に、期限切れはたたんでおく
  function nParentButtons(list, fromFind) {
    var ok = list.filter(function (o) { return !o.expired; }).sort(nByDate), ex = list.filter(function (o) { return o.expired; }).sort(nByDate);
    var btn = function (o) {
      return '<button type="button" class="pcand' + (nf.parentKey === o.key ? ' on' : '') + (o.expired ? ' expd' : '') + '" data-npar="' + esc(o.key) + '"><b>' + esc(o.no) + '</b>　' + esc(o.date) +
        (o.expired ? '<span class="chip exp">期限切れ</span>' : '') + (fromFind ? '<br>' + esc(o.name) : '') + '　' + esc([o.model, o.grade].filter(Boolean).join('・')) +
        '<br><span class="' + (o.expired ? 'exp' : 'meta') + '">' + (o.warranty ? '保証期限 ' + esc(o.warranty) : '保証期限の記入なし') + '</span></button>';
    };
    var html = ok.slice(0, 15).map(btn).join('');
    if (!ok.length) html += '<div class="note">保証期限内の修理はありません</div>';
    if (ex.length) {
      html += '<button type="button" class="linkbtn" data-nexp="1">' + (nf.showExpired ? '期限切れを隠す' : '期限切れも表示（' + ex.length + '件）') + '</button>';
      if (nf.showExpired) html += ex.slice(0, 15).map(btn).join('');
    }
    return html;
  }
  function nPickCustomer(i) {
    var g = nCusList[i]; if (!g) return;
    var o = g.last;
    var set = function (id, v) { var el = $(id); if (el && v) el.value = v; };
    set('nName', o.name); set('nTel', o.phone); set('nZip', o.zip); set('nAddr', o.address); set('nBirth', o.birth);
    if (!nVal('nModel')) set('nModel', o.model);
    if (o.sex && nForm.sex.indexOf(o.sex) >= 0) { nf.sex = o.sex; nSetSeg('sex', o.sex); }
    if (o.store === '営業') { nf.store = '営業'; nSetSeg('store', '営業'); nAutoKubun(); }
    $('nFind').value = ''; $('nFindRes').innerHTML = '<div class="okmsg">「' + esc(o.name) + '」の内容を入れました</div>';
    var tel = nDigits(o.phone);
    if (tel.length >= 10) { nf.lookTel = tel; nf.look = nLocalLook(tel); renderLook(nf.look); }
    nPrice();
  }

  function nApplyKind() {
    var re = nf.kind === '再修理';
    Array.prototype.forEach.call(document.querySelectorAll('[data-only="re"]'), function (el) { el.classList.toggle('hidden', !re); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-not="re"]'), function (el) { el.classList.toggle('hidden', re); });
    var l = $('nFindLbl'); if (l) l.textContent = re ? '元の修理を探す（お名前の一部・電話番号）' : 'お客様を探す（業者様・リピートの方）';
  }
  // 再修理：元の修理の候補（電話番号で見つかった、再修理でもキャンセルでもない受注）
  function nParents() {
    return (nf.look ? nf.look.orders : []).filter(nCanParent);
  }
  function nRenderParents() {
    var box = $('nParentList'); if (!box) return;
    var list = nParents();
    box.innerHTML = list.length ? nParentButtons(list, false) : (nf.look ? '<div class="note">この電話番号の修理が見つかりません。上の「お客様を探す」で名前でも探せます</div>' : '');
    var sel = $('nParentSel');
    if (sel) sel.innerHTML = nf.parent && nf.parent.expired ? '<div class="warnbox">保証期限が切れています。有料の修理なら「修理」で登録してください</div>' : '';
  }
  function nPickParent(key) {
    var o = nParents().filter(function (x) { return x.key === key; })[0] || (nIdx || []).filter(function (x) { return x.key === key; })[0]; if (!o) return;
    nf.parentKey = key; nf.parent = o;
    $('nParentNo').value = '';
    if (!nVal('nTel') && o.phone) { $('nTel').value = o.phone; }
    var tel = nDigits(o.phone); if (tel.length >= 10 && tel !== nf.lookTel && nIdx) { nf.lookTel = tel; nf.look = nLocalLook(tel); renderLook(nf.look); }
    nFindRender();
    var put = function (id, v) { var el = $(id); if (el && !String(el.value).trim() && v) el.value = v; };
    put('nName', o.name); put('nModel', o.model);
    if (!nf.grade && o.grade && nForm.grades.indexOf(o.grade) >= 0) { nf.grade = o.grade; nSetSeg('grade', o.grade); }
    var st = o.store === '大橋' ? 'インター' : o.store; // 福岡大橋店はインター店に移転
    if (!nf.store && st && nForm.stores.indexOf(st) >= 0) { nf.store = st; nSetSeg('store', st); nAutoKubun(); }
    nRenderParents();
  }
  function renderLook(r) {
    if (!r.orders.length) { $('nLook').innerHTML = '<div class="note">この電話番号の受注はありません（新しいお客様）</div>'; nRenderParents(); return; }
    var filled = [];
    var c = r.customer;
    if (c) {
      var put = function (id, v, label) { var el = $(id); if (el && !String(el.value).trim() && v) { el.value = v; filled.push(label); } };
      put('nName', c.name, 'お名前'); put('nZip', c.zip, '郵便番号'); put('nAddr', c.address, '住所'); put('nBirth', c.birth, '生年'); put('nModel', c.model, '車種');
      if (!nf.sex && c.sex && nForm.sex.indexOf(c.sex) >= 0) { nf.sex = c.sex; nSetSeg('sex', c.sex); filled.push('性別・会社'); }
      if (filled.length) nPrice();
    }
    var isRe = nf.kind === '再修理';
    var dups = r.orders.filter(function (o) { return o.dup && !!o.isRe === isRe; });
    var html = '<div class="panel">';
    if (dups.length) html += '<div class="warnbox">★同じ電話番号の受注がすでにあります。二重登録に注意してください</div>';
    html += '<div class="meta" style="margin-bottom:4px">この電話番号の受注</div>' + r.orders.map(function (o) {
      return '<div class="lk' + (o.dup && !!o.isRe === isRe ? ' dup' : '') + '"><b>' + esc(o.no || '番号なし') + '</b>' + (o.isRe ? '<span class="chip kind" style="margin-left:6px">再修理（元 ' + esc(o.parent) + '）</span>' : '') + '　' + esc(o.date) + '　' + esc([o.name, o.model, o.grade || o.content].filter(Boolean).join('・')) +
        (o.cancel ? '（キャンセル）' : '') + (o.warranty ? '<br><span class="meta">保証期限 ' + esc(o.warranty) + '</span>' : '') + '</div>';
    }).join('');
    if (filled.length) html += '<div class="okmsg">前回の内容で ' + esc(filled.join('・')) + ' を入れました（違っていれば直してください）</div>';
    html += '</div>';
    $('nLook').innerHTML = html;
    nRenderParents();
  }
  function nCollect() {
    return {
      kind: nf.kind, phone: nVal('nTel'), name: nVal('nName'), sex: nf.sex, date: nVal('nDate'), hold: $('nHold').checked, time: nVal('nTime'),
      store: nf.store, kubun: nf.kubun, model: nVal('nModel'), grade: nf.grade, amount: nVal('nAmount'), payment: nf.payment,
      content: nVal('nContent'), contact: nVal('nContact'), zip: nVal('nZip'), address: nVal('nAddr'), birth: nVal('nBirth'),
      mileage: nVal('nMile'), referral: nVal('nRef'), parentKey: nf.parentKey, parent: nVal('nParentNo'), note: nVal('nNote'),
      reReason: nf.kind === '再修理' && $('nReReason') ? $('nReReason').value : '',
    };
  }
  function nSave(force) {
    var f = nCollect();
    if (!f.name) { toast('お名前（会社名）を入れてください'); $('nName').focus(); return; }
    if (!f.hold && !f.date) { toast('修理日を入れてください（決まっていなければ「未定」）'); return; }
    if (!f.store) { toast('店舗を選んでください'); return; }
    if (nf.kind === 'その他' && !f.content) { toast('修理内容を入れてください'); $('nContent').focus(); return; }
    if (nf.kind === '再修理' && !f.parentKey && !f.parent) { toast('元の修理を選んでください'); return; }
    var go = function () {
      $('nSave').disabled = true;
      loading(true);
      call('newSave', { f: f, force: !!force }).then(function (r) {
        if (r.dup) {
          var msg = '同じ電話番号の受注があります。\n' + r.dup.map(function (o) { return (o.no || '番号なし') + '　' + o.date + '　' + [o.name, o.model].filter(Boolean).join('・'); }).join('\n') + '\n\n別の受注として新しく登録しますか？';
          return confirmSheet(msg, '新しく登録する').then(function (ok) { if (ok) { loading(false); nSave(true); } });
        }
        nResult = r; listCache = null; nfReset();
        renderNew();
        window.scrollTo(0, 0);
      }).catch(function (e) { toast(e.message); }).then(function () { loading(false); var b = $('nSave'); if (b) b.disabled = false; });
    };
    if (!f.phone && !force) {
      confirmSheet('電話番号が空欄です。電話番号がないと、お客様情報シート・領収書と自動でつながりません。このまま登録しますか？', 'このまま登録').then(function (ok) { if (ok) go(); });
      return;
    }
    go();
  }
  document.addEventListener('click', function (e) {
    if (location.hash !== '#/new') return;
    var t;
    if ((t = e.target.closest('[data-nseg] button'))) {
      var name = t.parentNode.getAttribute('data-nseg'), v = t.getAttribute('data-v');
      if (name === 'kind') {
        var before = nKind();
        nf.kind = v;
        var after = nKind();
        var c = $('nContent'); if (c && (!c.value || c.value === before.content)) c.value = after.content;
        $('nNext').innerHTML = '登録すると <b>' + esc(nForm.next[after.prefix] || (after.prefix + '?')) + '</b> になります（目安）';
        nSetSeg('kind', v); nApplyKind(); if (nf.look) renderLook(nf.look); nFindRender(); nPrice(); return;
      }
      if (name === 'payment' || name === 'grade' || name === 'sex') v = (nf[name] === v ? '' : v); // もう一度押すと外れる
      nf[name] = v;
      if (name === 'kubun') nf.kubunTouched = true;
      nSetSeg(name, v);
      if (name === 'store') nAutoKubun();
      if (name === 'store' || name === 'grade') nPrice();
      return;
    }
    if ((t = e.target.closest('[data-npar]'))) { nPickParent(t.getAttribute('data-npar')); return; }
    if ((t = e.target.closest('[data-ncus]'))) { nPickCustomer(Number(t.getAttribute('data-ncus'))); return; }
    if ((t = e.target.closest('[data-nexp]'))) { nf.showExpired = !nf.showExpired; nFindRender(); nRenderParents(); return; }
    if ((t = e.target.closest('[data-nprice]'))) { var p = t.getAttribute('data-nprice'); $('nAmount').value = p; nf.autoAmount = Number(p); return; }
    if ((t = e.target.closest('#nSave'))) { nSave(false); return; }
    if ((t = e.target.closest('[data-nagain]'))) { nResult = null; openNew(); return; }
  });

  // ---- はじめに ----
  token = loadToken();
  if (!token) { showLogin(''); return; }
  loading(true);
  call('me').then(function (d) { me = d; APP_VERSION = d.version || APP_VERSION; NEED_SCREEN = d.screen || d.version || NEED_SCREEN; versionCheck(); $('app').classList.remove('hidden'); route(); })
    .catch(function () { showLogin(''); }).then(function () { loading(false); });
})();
</script>
</body>
</html>
